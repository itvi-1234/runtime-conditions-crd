# This rule is not used by the project runtime-conditions-crd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over runtimeconditions.runtimeconditions.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: runtime-conditions-crd
    app.kubernetes.io/managed-by: kustomize
  name: runtimeconditionsprofile-admin-role
rules:
- apiGroups:
  - runtimeconditions.runtimeconditions.io
  resources:
  - runtimeconditionsprofiles
  verbs:
  - '*'
- apiGroups:
  - runtimeconditions.runtimeconditions.io
  resources:
  - runtimeconditionsprofiles/status
  verbs:
  - get
