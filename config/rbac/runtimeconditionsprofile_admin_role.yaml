# Convenience ClusterRole for users who need full control over
# RuntimeConditionsProfile resources. Not used by any controller in this
# repo - it's for cluster admins to hand out to people/service accounts.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: runtime-conditions-crd
    app.kubernetes.io/managed-by: kustomize
  name: runtimeconditionsprofile-admin-role
rules:
- apiGroups:
  - runtimeconditions.io
  resources:
  - runtimeconditionsprofiles
  verbs:
  - '*'
