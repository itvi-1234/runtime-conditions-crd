# Convenience ClusterRole for users who need to create/update/delete
# RuntimeConditionsProfile resources but not manage RBAC for others. Not
# used by any controller in this repo.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: runtime-conditions-crd
    app.kubernetes.io/managed-by: kustomize
  name: runtimeconditionsprofile-editor-role
rules:
- apiGroups:
  - runtimeconditions.io
  resources:
  - runtimeconditionsprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
