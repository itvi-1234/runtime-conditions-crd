# This rule is not used by the project runtime-conditions-crd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the runtimeconditions.runtimeconditions.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: runtime-conditions-crd
    app.kubernetes.io/managed-by: kustomize
  name: runtimeconditionsprofile-editor-role
rules:
- apiGroups:
  - runtimeconditions.runtimeconditions.io
  resources:
  - runtimeconditionsprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - runtimeconditions.runtimeconditions.io
  resources:
  - runtimeconditionsprofiles/status
  verbs:
  - get
