# Convenience ClusterRole for read-only access to RuntimeConditionsProfile
# resources. Not used by any controller in this repo.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: runtime-conditions-crd
    app.kubernetes.io/managed-by: kustomize
  name: runtimeconditionsprofile-viewer-role
rules:
- apiGroups:
  - runtimeconditions.io
  resources:
  - runtimeconditionsprofiles
  verbs:
  - get
  - list
  - watch
