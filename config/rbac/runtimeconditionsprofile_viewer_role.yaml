# This rule is not used by the project runtime-conditions-crd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to runtimeconditions.runtimeconditions.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: runtime-conditions-crd
    app.kubernetes.io/managed-by: kustomize
  name: runtimeconditionsprofile-viewer-role
rules:
- apiGroups:
  - runtimeconditions.runtimeconditions.io
  resources:
  - runtimeconditionsprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - runtimeconditions.runtimeconditions.io
  resources:
  - runtimeconditionsprofiles/status
  verbs:
  - get
