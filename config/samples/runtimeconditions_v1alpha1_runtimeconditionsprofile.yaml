## Sample RuntimeConditionsProfile, mirroring the request-coordinator profile
## from github.com/runtimeconditions/rc-demos/cilium-policy/profiles/request-coordinator.yaml
apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: request-coordinator
  labels:
    app.kubernetes.io/name: runtime-conditions-crd
    app.kubernetes.io/managed-by: kustomize
workload:
  uri: https://github.com/runtimeconditions/rc-demos/tree/main/cilium-policy/apps/resource-demo/services/request-coordinator
  version: dev
extensions:
  - https://runtimeconditions.io/extensions/common-integrations/v1alpha1/runtimeconditions.extension.yaml
conditions:
  - name: available-stock-capability
    kind: api
    interface:
      type: http
  - name: durable-request-history
    kind: datastore
    interface:
      type: relational
